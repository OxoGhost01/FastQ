name: Publish Python wheels to PyPI

on:
  release:
    types: [published]

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hiredis json-c

      - name: Build main FastQ library (macOS)
        if: runner.os == 'macOS'
        run: make

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-win32 *-musllinux* *i686*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_BEFORE_BUILD_LINUX: >-
            git clone --depth 1 -b v1.2.0 https://github.com/redis/hiredis /tmp/hiredis &&
            make -C /tmp/hiredis && make -C /tmp/hiredis install &&
            git clone --depth 1 -b json-c-0.17 https://github.com/json-c/json-c /tmp/json-c &&
            cmake -B /tmp/json-c/build /tmp/json-c -DCMAKE_INSTALL_PREFIX=/usr/local &&
            cmake --build /tmp/json-c/build --target install &&
            cd {project}/../.. && make
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          pip install build
          cd bindings/python
          python -m build --sdist --outdir ../../dist/

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1